<!DOCTYPE html>
<html lang="en" class="has-background-warning">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>430 Project 1</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Madimi+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script>
        // 4+ get endpoints getting diff data, 
        // 1+ supporting query parameters to filter/limit API data
        // - Search by name, GIVE AMOUNT
        // - Search by type (CHANGE-- RETURN ONLY NAME not all info DONE!), GIVE AMOUNT
        // - get favorites+reasoning, (RETURN ONLY NAME TYPE FAV AND REASONING???) GIVE AMOUNT
        // - get all pokemon, GIVE AMOUNT

        // 2+ post endpoints for adding/editing data
        // - create pokemon (name, type, height m (opt), weight kg (opt))
        // - add favorites w/ reasoning (insert name + reasoning)
        const handleResponse = async (response, method, content) => {

            switch (response.status) {
                case 200:
                    content.innerHTML = `<b>Success!</b>`;
                    break;
                case 201:
                    content.innerHTML = `<b>Pokemon created!</b>`;
                    break;
                case 204:
                    content.innerHTML = `<b class="has-text-primary">Pokemon favorited! (No Content)</b>`;
                    return;
                case 400:
                    content.innerHTML = `<b>Bad Request :(</b>`;
                    break;
                case 404:
                    content.innerHTML = `<b>Content Not Found </3</b>`;
                    break;
            }

            //get or post
            if (method !== "HEAD") {
                let finalOutput;
                let obj = await response.json();
                //dont display all data if its too long
                if (JSON.stringify(obj).length > 400) {
                    finalOutput = JSON.stringify(obj).slice(0, 400) + '...';
                } else {
                    finalOutput = JSON.stringify(obj);
                }
                //formatting with spaces after commas
                finalOutput = finalOutput.replaceAll(",", ", ");

                content.innerHTML += `
                <span class="tags has-addons my-3">
      <span class="tag is-dark">code</span>
      <span class="status-code tag ${response.status == 404 || response.status == 400 ? 'is-danger' : 'is-primary'}">${response.status}</span>
    </span><p>Content-Length: ${JSON.stringify(obj).length}</p><p class="pb-3">${finalOutput}</p>`;
            }
            //text is red if status code is 400/404
            document.querySelectorAll('.content-div *').forEach(
                e => {
                    if (response.status == 400 || response.status == 404) {
                        e.style.color = "#e24665";

                    } else {
                        e.style.color = '#86CB92';
                    }
                }
            )
            document.querySelector('.status-code').style.color = 'black';
        }

        const handleForm = async (form, content, searchParams) => {
            let url = form.getAttribute('action');
            url += `?${searchParams}`;

            //if content type is json, stringify. if its the other one, parse accordingly
            let method;
            let response;
            if (form.getAttribute('method') == "POST") {
                method = form.getAttribute('method');
                const name = document.querySelector("#createNameField").value;
                const type = document.querySelector("#typeSelect").value;
                const height = document.querySelector("#heightField").value;
                const weight = document.querySelector("#weightField").value;

                let formData = `name=${name}&type=${type}&height=${height ? height : 'Unknown'}&weight=${weight ? weight : 'Unknown'}`;

                formData = JSON.stringify({ name, type, height, weight });
                response = await fetch(url, {
                    method: form.getAttribute('method'),
                    headers: {
                        'Content-Type': 'application/json',
                        'Content-Length': formData.length,
                        'Accept': 'application/json',
                    },
                    body: formData,
                });
                handleResponse(response, method, content);

            } else {
                method = form.elements['method'].value;

                response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Length': form.length,
                        'Accept': 'application/json',
                    },
                });
                handleResponse(response, method, content);
            }
        }

        const showSection = (selectedForm) => {
            const forms = document.querySelectorAll('form');
            const divs = document.querySelectorAll('.content-div');
            //set clicked section to true/visible
            //set all other sections to not visible
            if (selectedForm.style.display == "block") {
                selectedForm.classList.add('hidden');
            } else {
                forms.forEach(form => {
                    form.classList.add('hidden');
                });
                selectedForm.classList.remove("hidden");
            }

            //clear out all content in divs
            divs.forEach(div => {
                div.innerHTML = "";
            });
        }

        const init = () => {

            //for getting pokemon
            const getPokemon = (form, content, searchParams) => {
                handleForm(form, content, searchParams);
                return false;
            }

            //when a header is clicked on, adjust visibility of elements accordingly
            document.querySelectorAll('h3').forEach(
                header => header.addEventListener('click', (e) => {
                    showSection(header.nextElementSibling);
                }));

            //when a form is submitted, handle its contents
            document.querySelectorAll('form').forEach(
                form => {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        //saving query parameters to append to url in handleForm
                        const formData = new FormData(form);
                        const searchParams = new URLSearchParams(formData);
                        getPokemon(form, form.querySelector('.content-div'), searchParams.toString());
                    });
                }
            );
        }

        window.onload = init;
    </script>
</head>

<body class="m-2">

                                <option value="Psychic">Psychic</option>
                                <option value="Ice">Ice</option>
                                <option value="Ground">Ground</option>
                                <option value="Rock">Rock</option>
                                <option value="Electric">Electric</option>

                                <option value="Fairy">Fairy</option>

                    <div class="is-flex is-align-content-center is-align-self-center">

        </section>
        <section>

                        <label class="title is-6 has-text-info-light m-3 ml-0">
                            <input type="radio" name="method" value="GET" checked />

                        </label><label class="title is-6 has-text-info-light m-3 ml-0">
                            <input type="radio" name="method" value="HEAD" />
                            HEAD
                        </label>
                    </div> <input class="button has-background-link" type="submit" value="Get Favorites" />
