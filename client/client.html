<body>
    <h1>Pokemon!</h1>
    <h2>GET Requests</h2>
    <div>
        <h3>Search by name</h3>
        <form id="nameForm" action="/getPokemon" method="get">
            <label for="name">Name: </label>
            <input id="nameField" type="text" name="name" />

    </div>
    <div>
        <h3>Search by type</h3>
        <form id="typeForm" action="/getPokemon" method="get">

            <select id="methodSelect">

                <option value="water">Water</option>

            <label>

            </label>

    </div>
    <div>

            <label for="favReason">Why are you favoriting this Pokemon?: </label>

        </form>
        <p id="addFavContent"></p>
