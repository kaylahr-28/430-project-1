<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>430 Project 1</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script>
        // 4+ get endpoints getting diff data, 
        // 1+ supporting query parameters to filter/limit API data
        // - Search by name
        // - Search by type
        // - get favorites+reasoning
        // - get all pokemon

        // 2+ post endpoints for adding/editing data
        // - create pokemon (name, type, height m, weight kg)
        // - add favorites w/ reasoning (insert name + reasoning)
        const handleResponse = async (response, method, content) => {


            switch (response.status) {
                case 200:
                    content.innerHTML = `<b>Success!</b>`;
                    break;
                case 201:
                    content.innerHTML = `<b>Created!</b>`;
                    break;
                case 204:
                    content.innerHTML = `<b>Favorited! (No Content)</b>`;
                    return;
                case 400:
                    content.innerHTML = `<b>Bad Request :(</b>`;
                    break;
                case 404:
                    content.innerHTML = `<b>Content Not Found </3</b>`;
                    break;
            }

            if (method !== "HEAD") {
                let finalOutput;
                let obj = await response.json();
                //dont display all data if its too long
                if (JSON.stringify(obj).length > 400) {
                    finalOutput = JSON.stringify(obj).slice(0, 400) + '...';
                } else {
                    finalOutput = JSON.stringify(obj);
                }
                content.innerHTML += `<p>Content-Length: ${JSON.stringify(obj).length}</p><p>${finalOutput}</p>`;//`${response.status == 400 || response.status == 404 ? JSON.stringify(obj.message) : finalOutput}`;
                console.log(obj);
            }
        }

        const handleForm = async (form, content) => {
            const url = form.getAttribute('action');
            const method = form.elements['method'].value;

            //if content type is json, stringify. if its the other one, parse accordingly


            const response = await fetch(url, {
                method: method,
                headers: {
                    'Content-Type': 'application/json',
                    'Content-Length': form.length,
                    'Accept': 'application/json',//['application/json', 'application/x-www-form-urlencoded'],
                },
            });
            handleResponse(response, method, content);
        }

        const showSection = (selectedForm) => {
            console.log("clicked");
            const forms = document.querySelectorAll('form');
            const divs = document.querySelectorAll('div');
            //set clicked section to true/visible
            //set all other sections to not visible
            if (selectedForm.style.display == "block") {
                selectedForm.style.display = "none";
            } else {
                forms.forEach(form => {
                    form.style.display = 'none';
                });
                selectedForm.style.display = 'block';
            }

            //clear out all content in divs
            divs.forEach(div => {
                div.innerHTML = "";
            });
        }

        const init = () => {
            const allForm = document.querySelector("#allForm");
            const typeForm = document.querySelector("#typeForm");
            const nameForm = document.querySelector("#nameForm");
            const favForm = document.querySelector("#favForm");
            const createForm = document.querySelector("#createForm");
            const addFavForm = document.querySelector("#addFavForm");

            const nameHeader = document.querySelector("#nameHeader");
            const typeHeader = document.querySelector("#typeHeader");
            const favHeader = document.querySelector("#favHeader");
            const allHeader = document.querySelector("#allHeader");
            const createHeader = document.querySelector("#createHeader");
            const addFavHeader = document.querySelector("#addFavHeader");

            const allContent = document.querySelector("#allContent");
            const typeContent = document.querySelector("#typeContent");
            const nameContent = document.querySelector("#nameContent");

            //for getting pokemon
            const getPokemon = (form, content) => {
                console.log(content);
                handleForm(form, content);
                return false;
            }

            allHeader.addEventListener('click', (e) => { showSection(allForm); })
            typeHeader.addEventListener('click', (e) => { showSection(typeForm); })
            nameHeader.addEventListener('click', (e) => { showSection(nameForm); })


            // allForm.addEventListener('submit', (e) => {
            //     e.preventDefault();
            //     getPokemon(allForm, allContent);
            // });
            // typeForm.addEventListener('submit', (e) => {
            //     const formData = new FormData(typeForm);
            //     const searchParams = new URLSearchParams(formData);
            //     console.log("searchParams new", searchParams);
            //     const newUrl = `${window.location.pathname}?${searchParams.toString()}`;

            //     e.preventDefault();
            //     window.history.pushState({}, '', newUrl);

            //     getPokemon(typeForm, typeContent);
            // });
            // nameForm.addEventListener('submit', (e) => {
            //     e.preventDefault();
            //     getPokemon(nameForm, nameContent);
            // });
            document.querySelectorAll('form').forEach(
                form => {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        const formData = new FormData(form);
                        const searchParams = new URLSearchParams(formData);
                        console.log("search paramsss", searchParams);
                        getPokemon(form, typeContent);

                    });
                }
            );

        }

        window.onload = init;
    </script>
</head>

<body>
    <h1>Pokemon!</h1>
    <h2>GET Requests</h2>
    <section>
        <h3 id="nameHeader">Search by name</h3>
        <form id="nameForm" action="/getPokemon">
            <label for="name">Name: </label>
            <input id="nameField" type="text" name="name" />
            <label>
                <input type="radio" name="method" value="GET" checked />
                GET
            </label><label>

                Ghost, Dark, Steel, Dragon</p>

            <input id="typeField" type="text" name="type" />

                <input type="radio" name="method" value="GET" checked />

    <section>

            <input id="reasonField" type="text" name="favReason" />
            <input type="submit" value="Favorite Pokemon" />

            <div id="addFavContent" name="content"></div>
        </form>
    </section>
</body>
