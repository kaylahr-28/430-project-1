<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>430 Project 1</title>
    <link rel="stylesheet" type="text/css" href="/style.css">
    <script>
        // 4+ get endpoints getting diff data, 
        // 1+ supporting query parameters to filter/limit API data
        // - Search by name (CHANGE-- RETURN ONLY NAME not all info), GIVE AMOUNT
        // - Search by type, GIVE AMOUNT
        // - get favorites+reasoning, (RETURN ONLY NAME TYPE FAV AND REASONING???) GIVE AMOUNT
        // - get all pokemon, GIVE AMOUNT

        // 2+ post endpoints for adding/editing data
        // - create pokemon (name, type, height m (opt), weight kg (opt))
        // - add favorites w/ reasoning (insert name + reasoning)
        const handleResponse = async (response, method, content) => {

            switch (response.status) {
                case 200:
                    content.innerHTML = `<b>Success!</b>`;
                    break;
                case 201:
                    content.innerHTML = `<b>Pokemon created!</b>`;
                    break;
                case 204:
                    content.innerHTML = `<b>Pokemon favorited! (No Content)</b>`;
                    return;
                case 400:
                    content.innerHTML = `<b>Bad Request :(</b>`;
                    break;
                case 404:
                    content.innerHTML = `<b>Content Not Found </3</b>`;
                    break;
            }

            if (method !== "HEAD") {
                let finalOutput;
                let obj = await response.json();
                //dont display all data if its too long
                if (JSON.stringify(obj).length > 400) {
                    finalOutput = JSON.stringify(obj).slice(0, 400) + '...';
                } else {
                    finalOutput = JSON.stringify(obj);
                }
                content.innerHTML += `<p>${response.status} status code</p><p>Content-Length: ${JSON.stringify(obj).length}</p><p>${finalOutput}</p>`;//`${response.status == 400 || response.status == 404 ? JSON.stringify(obj.message) : finalOutput}`;
            }
        }

        const handleForm = async (form, content, searchParams) => {
            let url = form.getAttribute('action');
            url += `?${searchParams}`;
            //if content type is json, stringify. if its the other one, parse accordingly
            let method;
            let response;
            if (form.getAttribute('method') == "POST") {
                method = form.getAttribute('method');
                const name = document.querySelector("#createNameField").value;
                const type = document.querySelector("#typeSelect").value;
                const height = document.querySelector("#heightField").value;
                const weight = document.querySelector("#weightField").value;


                let formData = `name=${name}&type=${type}&height=${height ? height : 'Unknown'}&weight=${weight ? weight : 'Unknown'}`;
                console.log(formData);

                //uhhhh fix this
                formData = JSON.stringify({ name, type, height, weight });
                console.log('from data again', formData);
                response = await fetch(url, {
                    method: form.getAttribute('method'),
                    headers: {
                        'Content-Type': 'application/json',
                        'Content-Length': formData.length,
                        'Accept': 'application/json',//['application/json', 'application/x-www-form-urlencoded'],
                    },
                    body: formData,
                });
                handleResponse(response, method, content);

            } else {
                method = form.elements['method'].value;

                response = await fetch(url, {
                    method: method,
                    headers: {
                        'Content-Type': 'application/json',
                        'Content-Length': form.length,
                        'Accept': 'application/json',//['application/json', 'application/x-www-form-urlencoded'],
                    },
                });
                handleResponse(response, method, content);

            }
        }

        const showSection = (selectedForm) => {
            const forms = document.querySelectorAll('form');
            const divs = document.querySelectorAll('div');
            //set clicked section to true/visible
            //set all other sections to not visible
            if (selectedForm.style.display == "block") {
                selectedForm.style.display = "none";
            } else {
                forms.forEach(form => {
                    form.style.display = 'none';
                });
                selectedForm.style.display = 'block';
            }

            //clear out all content in divs
            divs.forEach(div => {
                div.innerHTML = "";
            });
        }

        const init = () => {

            //for getting pokemon
            const getPokemon = (form, content, searchParams) => {
                handleForm(form, content, searchParams);
                return false;
            }

            //when a header is clicked on, adjust visibility of elements accordingly
            document.querySelectorAll('h3').forEach(
                header => header.addEventListener('click', (e) => {
                    showSection(header.nextElementSibling);
                }));

            //when a form is submitted, handle its contents
            document.querySelectorAll('form').forEach(
                form => {
                    form.addEventListener('submit', (e) => {
                        e.preventDefault();
                        //saving query parameters to append to url in handleForm
                        const formData = new FormData(form);
                        const searchParams = new URLSearchParams(formData);
                        getPokemon(form, form.querySelector('div'), searchParams.toString());
                    });
                }
            );
        }

        window.onload = init;
    </script>
</head>

<body>
    <a href="documentation.html">Go To Documentation</a>
    <h1>Pokemon!</h1>
    <h2>GET Requests</h2>
    <section>
        <h3 id="nameHeader">Search by name</h3>
        <form id="nameForm" action="/getPokemonName">
            <label for="name">Name: </label>
            <input id="nameField" type="text" name="name" />
            <label>
                <input type="radio" name="method" value="GET" checked />
                GET
            </label><label>
                <input type="radio" name="method" value="HEAD" />

            </label>
            <input type="submit" value="Get Pokemon By Name" />

            <div id="nameContent" name="content"></div>

    </section>
    <section>

                <option value="Psychic">Psychic</option>
                <option value="Ice">Ice</option>
                <option value="Ground">Ground</option>
                <option value="Rock">Rock</option>
                <option value="Electric">Electric</option>
                <option value="Bug">Bug</option>
                <option value="Normal">Normal</option>
                <option value="Fighting">Fighting</option>
                <option value="Fairy">Fairy</option>
                <option value="Ghost">Ghost</option>
                <option value="Dark">Dark</option>
                <option value="Steel">Steel</option>
                <option value="Dragon">Dragon</option>
            </select>
            <label>
                <input type="radio" name="method" value="GET" checked />
                GET
            </label><label>
                <input type="radio" name="method" value="HEAD" />
                HEAD
            </label>
            <input type="submit" value="Get Pokemon By Type" />

            <div id="typeContent" name="content"></div>
        </form>
    </section>
    <section>
        <h3 id="favHeader">Get favorites</h3>
        <form id="favForm" action="/getPokemonFavs">
            <label>
                <input type="radio" name="method" value="GET" checked />
                GET
            </label><label>
                <input type="radio" name="method" value="HEAD" />
                HEAD
            </label>
            <input type="submit" value="Get Favorites" />

            <div id="favContent" name="content"></div>
        </form>
    </section>
    <section>
        <h3 id="allHeader">Get all Pokemon</h3>
        <form id="allForm" action="/getPokemon">
            <label>
                <input type="radio" name="method" value="GET" checked />
                GET
            </label><label>
                <input type="radio" name="method" value="HEAD" />
                HEAD
            </label>
            <input type="submit" value="Get All" />

            <div id="allContent" name="content"></div>
        </form>
    </section>

    <h2>POST Requests</h2>
    <section>
        <h3 id="createHeader">Create a Pokemon</h3>
        <form id="createForm" action="/addPokemon" method="POST">

            <label for="name">Name: </label>
            <input id="createNameField" type="text" name="name" />
            <label for="type">Type: </label>
            <select id="typeSelect" name="type">
                <option value="Water">Water</option>
                <option value="Fire">Fire</option>
                <option value="Grass">Grass</option>
                <option value="Poison">Poison</option>
                <option value="Flying">Flying</option>
                <option value="Psychic">Psychic</option>
                <option value="Ice">Ice</option>
                <option value="Ground">Ground</option>
                <option value="Rock">Rock</option>
                <option value="Electric">Electric</option>
                <option value="Bug">Bug</option>
                <option value="Normal">Normal</option>
                <option value="Fighting">Fighting</option>
                <option value="Fairy">Fairy</option>
                <option value="Ghost">Ghost</option>
                <option value="Dark">Dark</option>
                <option value="Steel">Steel</option>
                <option value="Dragon">Dragon</option>
            </select>
            <label for="height">Height:</label>
            <input type="number" id="heightField" name="height" min="1" max="100">

            <label for="height">Weight:</label>
            <input type="number" id="weightField" name="weight" min="1" max="100">

            <input type="submit" value="Create Pokemon" />

            <div id="createContent" name="content"></div>
        </form>
    </section>
    <section>
        <h3 id="addFavHeader">Add pokemon to favorites</h3>
        <form id="favForm" action="/favPokemon" method="POST">

            <label for="name">Name: </label>
            <input id="favNameField" type="text" name="name" />
            <label for="favReason">Why are you favoriting this Pokemon?: </label>
            <input id="reasonField" type="text" name="favReason" />
            <input type="submit" value="Favorite Pokemon" />

            <div id="addFavContent" name="content"></div>
        </form>
    </section>
</body>

</html>
